name: myshopzy_rider
description: "MyShopzy Rider - delivery partner app (frontend only, mock data)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.0
  image_picker: ^1.1.2
  geolocator: ^14.0.2
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  crypto: ^3.0.6
  cupertino_icons: ^1.0.6
  connectivity_plus: ^7.3.1
  audioplayers: ^6.8.1
  vibration: ^3.2.1
  wakelock_plus: ^1.8.0
  flutter_local_notifications: ^23.0.0
  permission_handler: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
